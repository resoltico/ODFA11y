name: Bug report
description: Something audits, remediates or verifies incorrectly.
body:
  - type: markdown
    attributes:
      value: |
        **Never attach real or confidential documents.** Evidence bundles can contain authored
        content in remediated documents and PDFs; reports, diagnostics and document payloads
        can expose private paths or other sensitive information. Do not attach those artifacts
        publicly. Reproduce with a minimal synthetic file and inspect every attachment instead.
  - type: textarea
    id: observed
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Command and minimal reproduction
      description: The exact command, plus a synthetic document or its description.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Output of `odfa11y doctor`
      render: text
