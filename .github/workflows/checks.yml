name: Checks
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Create a draft release for the package version (main only)
        type: boolean
        default: false
env:
  ODFA11Y_ACTIONLINT_PACKAGE: "github.com/rhysd/actionlint/cmd/actionlint@v1.7.12"
  ODFA11Y_GITLEAKS_PACKAGE: "github.com/zricethezav/gitleaks/v8@v8.30.1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  static:
    name: Static analysis
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            .python-version
          restore-cache: ${{ github.event_name != 'workflow_dispatch' || !inputs.release }}
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Restore locked Python environment
        run: uv sync --locked --group audit
      - name: Audit workflow security
        run: uv run --no-sync zizmor --offline --persona pedantic --no-ignores --strict-collection .github/workflows
      - name: Check Python and architecture sources
        run: uv run --no-sync python -m tools.check lint types boundaries reference
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Identify Go cache inputs
        id: go-cache
        run: |
          printf 'version=%s\nmodules=%s\nbuild=%s\n' \
            "$(go env GOVERSION)" "$(go env GOMODCACHE)" "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned Go analysis tools
        id: go-cache-restore
        if: github.event_name != 'workflow_dispatch' || !inputs.release
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache.outputs.version }}-${{ env.ODFA11Y_ACTIONLINT_PACKAGE }}-${{ env.ODFA11Y_GITLEAKS_PACKAGE }}
      - name: Validate workflow syntax and shell commands
        run: go run "$ODFA11Y_ACTIONLINT_PACKAGE"
      - name: Scan Git history for secrets
        run: go run "$ODFA11Y_GITLEAKS_PACKAGE" git --redact --no-banner --ignore-gitleaks-allow --log-opts=--all
      - name: Save pinned Go analysis tools on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ steps.go-cache-restore.outputs.cache-primary-key }}
  test:
    name: Full verification (${{ matrix.os }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            .python-version
          restore-cache: ${{ github.event_name != 'workflow_dispatch' || !inputs.release }}
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Restore locked verification environment
        run: uv sync --locked --group audit
      - name: Install pinned native applications
        timeout-minutes: 20
        run: |
          office="$(uv run --no-sync python -m tools.install_libreoffice "$RUNNER_TEMP/libreoffice")"
          echo "$office" >> "$GITHUB_PATH"
          validator="$(uv run --no-sync python -m tools.install_verapdf "$RUNNER_TEMP/verapdf")"
          echo "$validator" >> "$GITHUB_PATH"
      - name: Verify source, native integration and clean distributions
        env:
          ODFA11Y_REQUIRE_INTEGRATION: "1"
        run: uv run --no-sync python -m tools.check all
      - name: Preserve tested release distributions
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  ci-gate:
    name: CI gate
    if: always()
    needs: [static, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if ! echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"'
            exit 1
          fi
  draft:
    name: Create draft release from tested distributions
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    needs: [ci-gate]
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create draft releases and attach the tested assets.
      id-token: write # Sign the build provenance attestation.
      attestations: write # Store the build provenance attestation.
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned uv tool
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Restore release metadata environment
        run: uv sync --locked
      - name: Download the exact tested distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist
      - name: Derive the release tag and require it to be unused
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tag="v$(uv run --no-sync python -c 'import odfa11y; print(odfa11y.__version__)')"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          uv run --no-sync python -m tools.github_release absent "$REPOSITORY" "$tag"
      - name: Verify release inputs and extract exact changelog notes
        run: >-
          uv run --no-sync python -m tools.check release
          --notes-output "$RUNNER_TEMP/release-notes.md"
      - name: Attest build provenance of the distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Record checksums
        run: (cd dist && sha256sum -- *.whl *.tar.gz) > "$RUNNER_TEMP/SHA256SUMS"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz "$RUNNER_TEMP/SHA256SUMS"
          --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Verify created draft target and exact tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          uv run --no-sync python -m tools.github_release draft "$REPOSITORY" "$RELEASE_TAG"
          --target "$GITHUB_SHA" --directory dist --checksums "$RUNNER_TEMP/SHA256SUMS"
          --notes "$RUNNER_TEMP/release-notes.md"
