name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  ODFA11Y_UV_VERSION: "0.12.23"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  quality:
    name: Quality (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.ODFA11Y_UV_VERSION }}
      - name: Validate workflow syntax and shell commands
        if: runner.os == 'Linux'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Scan Git history for secrets
        if: runner.os == 'Linux'
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --ignore-gitleaks-allow --log-opts=--all
      - name: Restore locked Python environment
        run: uv sync --locked --extra dev --group audit
      - name: Audit workflow security
        if: runner.os == 'Linux'
        run: uv run --no-sync zizmor --offline --persona pedantic --no-ignores --strict-collection .github/workflows
      - name: Audit locked dependencies
        if: runner.os == 'Linux'
        run: |
          uv export --locked --extra dev --group audit --no-emit-project --output-file "$RUNNER_TEMP/audit-requirements.txt" > /dev/null
          uv run --no-sync pip-audit --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/audit-requirements.txt"
      - name: Enforce module size and lint-exception policy
        run: uv run --no-sync python tools/check_quality.py
      - name: Lint all authored Python
        run: uv run --no-sync ruff check . --ignore-noqa
      - name: Check Python formatting
        run: uv run --no-sync ruff format --check .
      - name: Install LibreOffice for the real export test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          soffice --version
          command -v soffice
      - name: Unit and integration tests on Linux
        if: runner.os == 'Linux'
        run: uv run --no-sync pytest
      - name: Unit tests on macOS and Windows
        if: runner.os != 'Linux'
        run: uv run --no-sync pytest -m 'not integration'
      - name: Build wheel from source distribution
        run: uv run --no-sync python -m build
      - name: Verify installed wheel with locked dependencies
        run: |
          uv venv --python "$(cat .python-version)" "$RUNNER_TEMP/wheel-env"
          wheel_python="$RUNNER_TEMP/wheel-env/$(uv run --no-sync python -c 'import os; print("Scripts/python.exe" if os.name == "nt" else "bin/python")')"
          uv export --locked --extra dev --no-emit-project --output-file "$RUNNER_TEMP/wheel-requirements.txt" > /dev/null
          uv pip sync --python "$wheel_python" --require-hashes "$RUNNER_TEMP/wheel-requirements.txt"
          uv pip install --python "$wheel_python" --no-deps dist/*.whl
          "$wheel_python" - <<'PYTHON'
          import importlib.metadata
          import sys
          import tomllib
          from pathlib import Path
          import odfa11y

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          package = importlib.metadata.distribution(project["name"])
          assert Path(odfa11y.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert package.version == odfa11y.__version__
          assert package.metadata["Requires-Python"] == project["requires-python"]
          assert package.metadata["License-Expression"] == project["license"]
          license_file, = (p for p in package.files if str(p).endswith("/licenses/LICENSE"))
          assert package.locate_file(license_file).read_bytes() == Path("LICENSE").read_bytes()
          PYTHON
          "$wheel_python" -m pytest -m 'not integration'

      - name: Preserve tested release distributions
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  draft:
    name: Create draft release from tested distributions
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create draft releases and attach the tested assets.
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned uv tool
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.ODFA11Y_UV_VERSION }}
      - name: Restore release metadata environment
        run: uv sync --locked
      - name: Download the exact tested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Verify release inputs and extract exact changelog notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          uv run --no-sync python tools/check_release.py "$RELEASE_TAG" dist
          --notes-output "$RUNNER_TEMP/release-notes.md"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz
          --verify-tag --draft --title "$RELEASE_TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"
