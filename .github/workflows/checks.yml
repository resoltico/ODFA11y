name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Create a draft release for the package version (main only)
        type: boolean
        default: false
env:
  ODFA11Y_UV_VERSION: "0.12.23"
  ODFA11Y_LIBREOFFICE_VERSION: "26.8.0.3"
  ODFA11Y_LIBREOFFICE_SHA256: "d0a6031a3837e48f9854e6d2da6489b9fadbd814afa4741fa32a197741663a22"
  ODFA11Y_VERAPDF_VERSION: "1.30.2"
  ODFA11Y_VERAPDF_SHA256: "6cc6341cb1af644044054b81f00a6590a7918abb18f762243de115258bcad838"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  static:
    name: Static analysis
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.ODFA11Y_UV_VERSION }}
      - name: Validate workflow syntax and shell commands
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --ignore-gitleaks-allow --log-opts=--all
      - name: Restore locked Python environment
        run: uv sync --locked --group audit
      - name: Audit workflow security
        run: uv run --no-sync zizmor --offline --persona pedantic --no-ignores --strict-collection .github/workflows
      - name: Audit locked dependencies
        run: |
          uv export --locked --group audit --no-emit-project --output-file "$RUNNER_TEMP/audit-requirements.txt" > /dev/null
          uv run --no-sync pip-audit --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/audit-requirements.txt"
      - name: Enforce module size and lint-exception policy
        run: uv run --no-sync python tools/check_quality.py
      - name: Lint all authored Python
        run: uv run --no-sync ruff check . --ignore-noqa
      - name: Check Python formatting
        run: uv run --no-sync ruff format --check .
      - name: Type-check source, tests and tools
        run: uv run --no-sync ty check
      - name: Enforce package boundaries
        run: |
          uv run --no-sync tach check
          uv run --no-sync tach check-external
  test:
    name: Quality (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.ODFA11Y_UV_VERSION }}
      - name: Restore locked Python environment
        run: uv sync --locked
      - name: Unit tests with coverage on Linux
        if: runner.os == 'Linux'
        run: uv run --no-sync pytest -m 'not integration' --cov
      - name: Unit tests on macOS and Windows
        if: runner.os != 'Linux'
        run: uv run --no-sync pytest -m 'not integration'
      - name: Build source distribution and wheel
        run: uv build
      - name: Verify the distributions rebuild byte for byte
        if: runner.os == 'Linux'
        run: |
          uv build --out-dir "$RUNNER_TEMP/rebuild"
          (cd dist && sha256sum -- *.whl *.tar.gz) > "$RUNNER_TEMP/first.sha256"
          (cd "$RUNNER_TEMP/rebuild" && sha256sum -- *.whl *.tar.gz) | diff - "$RUNNER_TEMP/first.sha256"
      - name: Verify installed wheel with locked dependencies
        run: |
          uv venv --python "$(cat .python-version)" "$RUNNER_TEMP/wheel-env"
          wheel_python="$RUNNER_TEMP/wheel-env/$(uv run --no-sync python -c 'import os; print("Scripts/python.exe" if os.name == "nt" else "bin/python")')"
          uv export --locked --no-emit-project --output-file "$RUNNER_TEMP/wheel-requirements.txt" > /dev/null
          uv pip sync --python "$wheel_python" --require-hashes "$RUNNER_TEMP/wheel-requirements.txt"
          uv pip install --python "$wheel_python" --no-deps dist/*.whl
          "$wheel_python" - <<'PYTHON'
          import importlib.metadata
          import sys
          import tomllib
          from pathlib import Path
          import odfa11y
          import odfa11y.odf

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          package = importlib.metadata.distribution(project["name"])
          assert Path(odfa11y.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert package.version == odfa11y.__version__
          assert package.metadata["Requires-Python"] == project["requires-python"]
          assert package.metadata["License-Expression"] == project["license"]
          assert any(str(p).endswith("odfa11y/py.typed") for p in package.files)
          notice = "src/odfa11y/odf/schemas/NOTICE.txt"
          notice_file, = (p for p in package.files if str(p).endswith(f"/licenses/{notice}"))
          assert package.locate_file(notice_file).read_bytes() == Path(notice).read_bytes()
          bundled = {Path(str(p)).name for p in package.files if "odf/schemas/" in str(p)}
          assert {"OpenDocument-v1.4-schema.rng", "PROVENANCE.toml"} <= bundled
          assert odfa11y.odf.provenance()
          license_file, = (p for p in package.files if str(p).endswith("/licenses/LICENSE"))
          assert package.locate_file(license_file).read_bytes() == Path("LICENSE").read_bytes()
          PYTHON
          "$wheel_python" -m pytest -m 'not integration'
      - name: Preserve tested release distributions
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  integration:
    name: Integration (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.ODFA11Y_UV_VERSION }}
      - name: Restore locked Python environment
        run: uv sync --locked
      - name: Install LibreOffice on Linux
        if: runner.os == 'Linux'
        run: |
          archive="$RUNNER_TEMP/libreoffice.tar.gz"
          directory="$RUNNER_TEMP/libreoffice"
          filename="LibreOffice_${ODFA11Y_LIBREOFFICE_VERSION}_Linux_x86-64_deb.tar.gz"
          curl --fail --location --retry 3 \
            "https://downloadarchive.documentfoundation.org/libreoffice/old/$ODFA11Y_LIBREOFFICE_VERSION/deb/x86_64/$filename" \
            --output "$archive"
          echo "$ODFA11Y_LIBREOFFICE_SHA256  $archive" | sha256sum --check -
          mkdir "$directory"
          tar -xzf "$archive" -C "$directory"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$directory"/*/DEBS/*.deb
          series="${ODFA11Y_LIBREOFFICE_VERSION%.*.*}"
          echo "/opt/libreoffice$series/program" >> "$GITHUB_PATH"
      - name: Install LibreOffice on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --cask libreoffice
          echo "/Applications/LibreOffice.app/Contents/MacOS" >> "$GITHUB_PATH"
      - name: Install LibreOffice on Windows
        if: runner.os == 'Windows'
        run: |
          choco install libreoffice-fresh --no-progress --yes
          echo "C:\Program Files\LibreOffice\program" >> "$GITHUB_PATH"
      - name: Install pinned veraPDF
        run: |
          java -version
          directory="$(uv run --no-sync python tools/install_verapdf.py "$ODFA11Y_VERAPDF_VERSION" "$ODFA11Y_VERAPDF_SHA256" "$RUNNER_TEMP/verapdf")"
          echo "$directory" >> "$GITHUB_PATH"
      - name: Integration tests against the real applications
        env:
          ODFA11Y_REQUIRE_INTEGRATION: "1"
        run: |
          uv run --no-sync odfa11y doctor --format json
          uv run --no-sync pytest -m integration
  ci-gate:
    name: CI gate
    if: always()
    needs: [static, test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if ! echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"'
            exit 1
          fi
  draft:
    name: Create draft release from tested distributions
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    needs: [ci-gate]
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create draft releases and attach the tested assets.
      id-token: write # Sign the build provenance attestation.
      attestations: write # Store the build provenance attestation.
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned uv tool
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.ODFA11Y_UV_VERSION }}
      - name: Restore release metadata environment
        run: uv sync --locked
      - name: Download the exact tested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Derive the release tag and require it to be unused
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tag="v$(uv run --no-sync python -c 'import odfa11y; print(odfa11y.__version__)')"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          if gh api "repos/$REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$REPOSITORY" > /dev/null 2>&1; then
            echo "A release for $tag already exists" >&2
            exit 1
          fi
      - name: Verify release inputs and extract exact changelog notes
        run: >-
          uv run --no-sync python tools/check_release.py "$RELEASE_TAG" dist
          --notes-output "$RUNNER_TEMP/release-notes.md"
      - name: Attest build provenance of the distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Record checksums
        run: (cd dist && sha256sum -- *.whl *.tar.gz) > "$RUNNER_TEMP/SHA256SUMS"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz "$RUNNER_TEMP/SHA256SUMS"
          --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"
