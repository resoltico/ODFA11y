source_roots = ["src"]
exclude = ["tests", "tools", "**/__pycache__"]
root_module = "ignore"
forbid_circular_dependencies = true
exact = true

# The ODF core understands OpenDocument structure; a document family understands what its
# documents mean. Dependencies point downward only:
#
#   cli -> pipeline / config -> audit / remediation / pdf / fidelity / evidence
#       -> families (registry) -> families.<family> -> adapter (contract) -> odf -> leaves
#
# Families never import each other, and nothing below the registry imports a family.
# audit, remediation, pdf, fidelity and evidence never import each other.

[[modules]]
path = "odfa11y.errors"
depends_on = []

[[modules]]
path = "odfa11y.safe_xml"
depends_on = []

[[modules]]
path = "odfa11y.staging"
depends_on = []

[[modules]]
path = "odfa11y.pdf_limits"
depends_on = ["odfa11y.errors"]

[[modules]]
path = "odfa11y.report"
depends_on = []

[[modules]]
path = "odfa11y.external_tools"
depends_on = ["odfa11y.errors"]

[[modules]]
path = "odfa11y.odf"
depends_on = ["odfa11y.errors", "odfa11y.safe_xml", "odfa11y.staging"]

[[modules]]
path = "odfa11y.adapter"
depends_on = ["odfa11y.errors"]

[[modules]]
path = "odfa11y.content"
depends_on = ["odfa11y.adapter", "odfa11y.errors", "odfa11y.odf"]

[[modules]]
path = "odfa11y.families.text"
depends_on = ["odfa11y.content", "odfa11y.adapter", "odfa11y.errors", "odfa11y.odf", "odfa11y.report"]

[[modules]]
path = "odfa11y.families.spreadsheet"
depends_on = ["odfa11y.content", "odfa11y.adapter", "odfa11y.errors", "odfa11y.odf", "odfa11y.report"]

[[modules]]
path = "odfa11y.families"
depends_on = [
  "odfa11y.adapter",
  "odfa11y.families.spreadsheet",
  "odfa11y.families.text",
  "odfa11y.odf",
  "odfa11y.report",
]

[[modules]]
path = "odfa11y.audit"
depends_on = [
  "odfa11y.errors",
  "odfa11y.families",
  "odfa11y.odf",
  "odfa11y.report",
]

[[modules]]
path = "odfa11y.remediation"
depends_on = ["odfa11y.content", "odfa11y.adapter", "odfa11y.errors", "odfa11y.families", "odfa11y.odf"]

[[modules]]
path = "odfa11y.pdf"
depends_on = [
  "odfa11y.errors",
  "odfa11y.external_tools",
  "odfa11y.pdf_limits",
  "odfa11y.report",
  "odfa11y.safe_xml",
  "odfa11y.staging",
]

[[modules]]
path = "odfa11y.fidelity"
depends_on = ["odfa11y.errors", "odfa11y.pdf_limits", "odfa11y.report"]

[[modules]]
path = "odfa11y.evidence"
depends_on = ["odfa11y.errors", "odfa11y.staging"]

[[modules]]
path = "odfa11y.config"
depends_on = [
  "odfa11y.adapter",
  "odfa11y.errors",
  "odfa11y.families",
  "odfa11y.fidelity",
  "odfa11y.odf",
  "odfa11y.remediation",
]

[[modules]]
path = "odfa11y.pipeline"
depends_on = [
  "odfa11y.audit",
  "odfa11y.errors",
  "odfa11y.evidence",
  "odfa11y.families",
  "odfa11y.fidelity",
  "odfa11y.odf",
  "odfa11y.pdf",
  "odfa11y.remediation",
  "odfa11y.report",
]

[[modules]]
path = "odfa11y.cli"
depends_on = [
  "odfa11y.audit",
  "odfa11y.config",
  "odfa11y.errors",
  "odfa11y.evidence",
  "odfa11y.external_tools",
  "odfa11y.families",
  "odfa11y.families.text",
  "odfa11y.fidelity",
  "odfa11y.odf",
  "odfa11y.pdf",
  "odfa11y.pipeline",
  "odfa11y.remediation",
  "odfa11y.report",
]

# A package's public API is exactly what its __init__ re-exports.
[[interfaces]]
from = [
  "odfa11y.content",
  "odfa11y.adapter",
  "odfa11y.audit",
  "odfa11y.cli",
  "odfa11y.config",
  "odfa11y.evidence",
  "odfa11y.families",
  "odfa11y.families.spreadsheet",
  "odfa11y.families.text",
  "odfa11y.fidelity",
  "odfa11y.odf",
  "odfa11y.pdf",
  "odfa11y.pipeline",
  "odfa11y.remediation",
  "odfa11y.report",
]
expose = ["[^.]+"]
