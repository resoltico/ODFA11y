# A package's public API is exactly what its __init__ re-exports.
[[interfaces]]
from = [
  "odfa11y.batch",
  "odfa11y.content",
  "odfa11y.adapter",
  "odfa11y.audit",
  "odfa11y.cli",
  "odfa11y.config",
  "odfa11y.evidence",
  "odfa11y.families",
  "odfa11y.families.chart",
  "odfa11y.families.database",
  "odfa11y.families.drawing",
  "odfa11y.families.formula",
  "odfa11y.families.image",
  "odfa11y.families.presentation",
  "odfa11y.families.spreadsheet",
  "odfa11y.families.text",
  "odfa11y.fidelity",
  "odfa11y.odf",
  "odfa11y.pdf",
  "odfa11y.pdf_content",
  "odfa11y.pipeline",
  "odfa11y.remediation",
  "odfa11y.report",
]
expose = ["[^.]+"]

# Version metadata is a leaf; unregistered package files inherit this boundary.
[[modules]]
path = "odfa11y"
depends_on = []

# The Python module entry point is the only package-level caller of the CLI.
[[modules]]
path = "odfa11y.__main__"
depends_on = ["odfa11y.cli"]

[[interfaces]]
from = ["odfa11y"]
expose = ["__version__"]
