[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "odfa11y"
dynamic = ["version"]
description = "Deterministic ODF 1.4 accessibility engineering and PDF/UA QA for Writer documents"
readme = "README.md"
requires-python = ">=3.14"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Ervins Strauhmanis" }
]
keywords = ["ODF", "ODT", "accessibility", "PDF/UA", "LibreOffice", "OpenDocument"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "lxml>=6.1.3,<7",
  "pypdf>=6.19.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "build>=1.6.1,<2",
  "ruff==0.16.10",
]

[dependency-groups]
audit = [
  "pip-audit==2.10.1",
  "zizmor==1.30.1",
]

[project.scripts]
odfa11y = "odfa11y.cli:main"

[project.urls]
"Repository" = "https://github.com/resoltico/ODFA11y"
"Issues" = "https://github.com/resoltico/ODFA11y/issues"
"ODF 1.4 standard" = "https://www.oasis-open.org/standard/opendocument-v1-4/"
"ODF 1.4 specification" = "https://docs.oasis-open.org/office/OpenDocument/v1.4/"
"LibreOffice PDF/UA reference" = "https://help.libreoffice.org/latest/en-US/text/shared/01/ref_pdf_export_universal_accessibility.html"
"veraPDF" = "https://verapdf.org/"

[tool.hatch.version]
path = "src/odfa11y/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/odfa11y"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/odfa11y",
  "/tests",
  "/tools",
  "/docs",
  "/.github",
  "/.editorconfig",
  "/.gitattributes",
  "/.python-version",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra"
strict = true
filterwarnings = ["error"]
testpaths = ["tests"]
markers = [
  "integration: tests that invoke an external application such as LibreOffice",
]

[tool.ruff]
required-version = "==0.16.10"
target-version = "py314"
preview = true
line-length = 100
respect-gitignore = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # These rules conflict with Ruff's formatter; formatting is checked separately.
  "missing-trailing-comma", "single-line-implicit-string-concatenation",
  # Use imperative, single-line summary followed by a blank line before details.
  "incorrect-blank-line-before-class", "multi-line-summary-second-line",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-returns = 6
max-statements = 50

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.flake8-copyright]
notice-rgx = "SPDX-License-Identifier: MPL-2\\.0"
min-file-size = 0

[tool.odfa11y.quality]
max-file-lines = 300

[tool.ruff.lint.per-file-ignores]
# pytest assertions provide failure introspection; test names describe behavior.
"tests/**" = ["assert", "undocumented-public-function"]
# The fixture exposes independent document features as named keyword arguments.
"tests/fixtures.py" = ["too-many-arguments"]
# Reports accept three identifiers plus named location/details/fixability fields.
"src/odfa11y/models.py" = ["too-many-arguments"]
# Preserve the public API's explicit spacing controls, all optional controls keyword-only.
"src/odfa11y/spacing.py" = ["too-many-arguments"]
# CLI output is its stdout/stderr interface; subprocess is used for timeout error handling.
"src/odfa11y/cli.py" = ["print", "suspicious-subprocess-import"]
# These subprocesses invoke explicitly selected local tools with argument lists, never a shell.
"src/odfa11y/pdf_export.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import"]
# Reporting prints the CLI interface and queries explicitly selected local tools.
"src/odfa11y/cli_reporting.py" = ["print", "subprocess-without-shell-equals-true", "suspicious-subprocess-import"]

# lxml's documented public tree type is named _ElementTree; used in isinstance.
"src/odfa11y/odt_package.py" = ["private-member-access"]
# Serialized configuration readers preserve ValueError for malformed input.
"src/odfa11y/config.py" = ["type-check-without-type-error"]
# JSON CLI configuration preserves ValueError for malformed serialized input.
"src/odfa11y/cli_options.py" = ["type-check-without-type-error"]

[tool.ruff.lint.extend-per-file-ignores]
# pypdf has no public registration API for synthetic indirect structure objects.
"tests/test_pdf_inspection.py" = ["private-member-access"]
