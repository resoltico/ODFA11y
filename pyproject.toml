[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "odfa11y"
dynamic = ["version"]
description = "Audit, remediate and verify OpenDocument files for accessible PDF/UA, with evidence"
readme = "README.md"
requires-python = ">=3.14"
# The project is MPL-2.0; the bundled OASIS ODF schemas carry OASIS's own notice (see NOTICE.txt).
license = "MPL-2.0 AND LicenseRef-OASIS-ODF-Notice"
license-files = ["LICENSE", "src/odfa11y/odf/schemas/NOTICE.txt"]
authors = [
  { name = "Ervins Strauhmanis" }
]
keywords = ["ODF", "ODT", "accessibility", "PDF/UA", "LibreOffice", "OpenDocument"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "lxml>=6.1.3,<7",
  "pillow>=12.3.0,<13",
  "pypdf>=6.19.0,<7",
  "pypdfium2>=5.14.0,<6",
]

[dependency-groups]
dev = [
  "hypothesis>=6.152.0,<7",
  "types-lxml==2026.2.16",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff==0.16.10",
  "tach==0.35.3",
  "ty==0.0.85",
]
audit = [
  "pip-audit==2.10.1",
  "zizmor==1.30.1",
]

[project.scripts]
odfa11y = "odfa11y.cli:main"

[project.urls]
"Changelog" = "https://github.com/resoltico/ODFA11y/blob/main/CHANGELOG.md"
"Repository" = "https://github.com/resoltico/ODFA11y"
"Issues" = "https://github.com/resoltico/ODFA11y/issues"
"ODF 1.4 standard" = "https://www.oasis-open.org/standard/opendocument-v1-4/"
"ODF 1.4 specification" = "https://docs.oasis-open.org/office/OpenDocument/v1.4/"
"LibreOffice PDF/UA reference" = "https://help.libreoffice.org/latest/en-US/text/shared/01/ref_pdf_export_universal_accessibility.html"
"veraPDF" = "https://verapdf.org/"

[tool.hatch.version]
path = "src/odfa11y/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/odfa11y"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/odfa11y",
  "/tests",
  "/tools",
  "/docs",
  "/.github",
  "/.editorconfig",
  "/.gitattributes",
  "/.python-version",
  "/tach.toml",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra -p no:tach"
strict = true
filterwarnings = ["error"]
testpaths = ["tests"]
markers = [
  "integration: tests that invoke an external application such as LibreOffice",
]

[tool.coverage.run]
branch = true
source_pkgs = ["odfa11y"]

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "tools"]

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
required-version = "==0.16.10"
target-version = "py314"
preview = true
line-length = 100
respect-gitignore = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # These rules conflict with Ruff's formatter; formatting is checked separately.
  "missing-trailing-comma", "single-line-implicit-string-concatenation",
  # Use imperative, single-line summary followed by a blank line before details.
  "incorrect-blank-line-before-class", "multi-line-summary-second-line",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-returns = 6
max-statements = 50

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.flake8-copyright]
notice-rgx = "SPDX-License-Identifier: MPL-2\\.0"
min-file-size = 0

[tool.odfa11y.quality]
max-file-lines = 300

[tool.ruff.lint.per-file-ignores]
# pytest assertions provide failure introspection; test names describe behavior; expected
# values are literals, and identical renders must differ by exactly zero.
"tests/**" = ["assert", "undocumented-public-function", "magic-value-comparison", "float-equality-comparison"]
# The fixture exposes independent document features as named keyword arguments.
"tests/fixtures.py" = ["too-many-arguments"]
# CLI output is its stdout/stderr interface.
"src/odfa11y/cli/commands.py" = ["print"]
# These subprocesses invoke explicitly selected local tools with argument lists, never a shell.
"src/odfa11y/pdf/export.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import"]
# Version probes run an explicitly selected local tool with an argument list; stopping a
# timed-out process tree on Windows needs the system taskkill, found through PATH.
"src/odfa11y/external_tools.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import", "start-process-with-partial-path"]
# veraPDF is an explicitly selected local validator, invoked with an argument list.
"src/odfa11y/pdf/verapdf.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import"]


[tool.ruff.lint.extend-per-file-ignores]
# lxml's element type is named _Element; the selector filters XPath results with isinstance.
"src/odfa11y/odf/xpath.py" = ["private-member-access"]
# Same reason: schema errors are located with XPath and filtered with isinstance.
"src/odfa11y/odf/schema.py" = ["private-member-access"]
# These classes implement the abstract storage interface; whether a part or member exists
# does not depend on instance state for every layout.
"src/odfa11y/odf/flat.py" = ["no-self-use"]
# Same reason for the ZIP layout.
"src/odfa11y/odf/package.py" = ["no-self-use"]
# The tests exercise the subprocess wrapper and name the exception it raises on timeout.
"tests/test_external_tools.py" = ["suspicious-subprocess-import"]
# pypdf has no public registration API for synthetic indirect structure objects.
"tests/test_pdf_inspection.py" = ["private-member-access"]
# Same reason: synthetic PDFs register indirect structure objects.
"tests/pdf_fixtures.py" = ["private-member-access"]
