[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "odfa11y"
version = "0.9.0"
description = "Audit and explicitly remediate OpenDocument families; verify supported PDF/UA exports with evidence"
readme = "README.md"
requires-python = ">=3.15"
# Owner code uses AGPL-3.0-only; bundled standards retain OASIS and W3C terms.
license = "AGPL-3.0-only AND LicenseRef-OASIS-ODF-Notice AND W3C"
license-files = ["LICENSE", "PROJECT-NOTICE.md", "LICENSE-COMMERCIAL.md", "THIRD-PARTY-NOTICES.md", "src/odfa11y/odf/schemas/NOTICE.txt", "src/odfa11y/odf/schemas/mathml/NOTICE.txt", "src/odfa11y/odf/formula_data/NOTICE.txt"]
authors = [
  { name = "Ervins Strauhmanis" }
]
keywords = ["ODF", "ODT", "accessibility", "PDF/UA", "LibreOffice", "OpenDocument"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "lxml>=6.1.3,<7",
  "pillow>=13.0.0,<14",
  "pypdf>=7.1.0,<8",
  "pypdfium2>=5.15.2,<6",
]

[dependency-groups]
dev = [
  "hypothesis>=6.170.15,<7",
  "types-lxml==2026.2.16",
  "pytest>=9.2.0,<10",
  "pytest-cov>=7.1.0,<8",
  "pytest-xdist>=3.8.0,<4",
  "ruff==0.17.5",
  "tach==0.35.3",
  "ty==0.0.104",
  "jsonschema>=4.26.0,<5",
  "markdown-it-py==4.3.0",
]
audit = [
  "pip-audit==2.10.1",
  "zizmor==1.32.0",
]

[project.scripts]
odfa11y = "odfa11y.cli:main"

[project.urls]
"Changelog" = "https://github.com/resoltico/ODFA11y/blob/main/CHANGELOG.md"
"Repository" = "https://github.com/resoltico/ODFA11y"
"Issues" = "https://github.com/resoltico/ODFA11y/issues"
"ODF 1.4 standard" = "https://www.oasis-open.org/standard/opendocument-v1-4/"
"ODF 1.4 specification" = "https://docs.oasis-open.org/office/OpenDocument/v1.4/"
"LibreOffice PDF/UA reference" = "https://help.libreoffice.org/latest/en-US/text/shared/01/ref_pdf_export_universal_accessibility.html"
"veraPDF" = "https://verapdf.org/"

[tool.hatch.build.targets.wheel]
packages = ["src/odfa11y"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/README.md", "/LICENSE", "/PROJECT-NOTICE.md", "/LICENSE-COMMERCIAL.md", "/THIRD-PARTY-NOTICES.md", "/src/odfa11y"]

[tool.uv]
required-version = "==0.13.8"

[tool.pytest.ini_options]
addopts = "-ra -p no:tach"
strict = true
filterwarnings = ["error"]
faulthandler_timeout = 300
testpaths = ["tests"]
# Remove successful tmp_path outputs; retain pytest's three-session failed-call history.
tmp_path_retention_policy = "failed"
markers = [
]

[tool.coverage.run]
branch = true
source_pkgs = ["odfa11y"]

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true

[tool.ty.src]
include = ["src", "tests", "tools"]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
required-version = "==0.17.5"
preview = true
line-length = 100
respect-gitignore = true
exclude = [".git", ".venv", "__pycache__", ".ruff_cache", "build/**", "dist/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF", "PL", "C90", "PT", "PTH", "TRY", "DTZ", "ERA", "T20", "CPY001", "D"]
explicit-preview-rules = true
# Complexity has one owner: McCabe's control-flow cap.
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-copyright]
notice-rgx = "SPDX-License-Identifier: AGPL-3\\.0-only"
min-file-size = 0

[tool.ruff.lint.per-file-ignores]
"src/odfa11y/cli/writer.py" = ["T20"]
# Only the root API and application use cases require public docstrings.
"!src/odfa11y/{application/**,__init__.py}" = ["D"]
# Pytest assertions, descriptive test names, literal expectations and exact render comparisons.
"tests/**" = ["assert", "magic-value-comparison", "float-equality-comparison"]
# Test subprocesses select local tools; pypdf fixtures require its private registration API.
"tests/tools/test_architecture.py" = ["suspicious-subprocess-import"]
"tests/cli/test_cli_input_failures.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"tests/native/test_external_tools.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"tests/pdf/test_pdf_inspection.py" = ["private-member-access"]
"tests/fixtures/pdf.py" = ["private-member-access"]
