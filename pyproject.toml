[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "odfa11y"
version = "0.7.0"
description = "Audit and explicitly remediate OpenDocument families; verify supported PDF/UA exports with evidence"
readme = "README.md"
requires-python = ">=3.15"
# Code uses MPL-2.0; bundled ODF and MathML grammars retain OASIS and W3C notices.
license = "MPL-2.0 AND LicenseRef-OASIS-ODF-Notice AND W3C"
license-files = ["LICENSE", "src/odfa11y/odf/schemas/NOTICE.txt", "src/odfa11y/odf/schemas/mathml/NOTICE.txt", "src/odfa11y/content/formula_data/NOTICE.txt"]
authors = [
  { name = "Ervins Strauhmanis" }
]
keywords = ["ODF", "ODT", "accessibility", "PDF/UA", "LibreOffice", "OpenDocument"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "lxml>=6.1.3,<7",
  "pillow>=13.0.0,<14",
  "pypdf>=6.21.3,<7",
  "pypdfium2>=5.14.0,<6",
]

[dependency-groups]
dev = [
  "hypothesis>=6.170.12,<7",
  "types-lxml==2026.2.16",
  "pytest>=9.2.0,<10",
  "pytest-cov>=7.1.0,<8",
  "pytest-xdist>=3.8.0,<4",
  "ruff==0.17.3",
  "tach==0.35.3",
  "ty==0.0.93",
  "jsonschema>=4.26.0,<5",
]
audit = [
  "pip-audit==2.10.1",
  "zizmor==1.31.1",
]

[project.scripts]
odfa11y = "odfa11y.cli:main"

[project.urls]
"Changelog" = "https://github.com/resoltico/ODFA11y/blob/main/CHANGELOG.md"
"Repository" = "https://github.com/resoltico/ODFA11y"
"Issues" = "https://github.com/resoltico/ODFA11y/issues"
"ODF 1.4 standard" = "https://www.oasis-open.org/standard/opendocument-v1-4/"
"ODF 1.4 specification" = "https://docs.oasis-open.org/office/OpenDocument/v1.4/"
"LibreOffice PDF/UA reference" = "https://help.libreoffice.org/latest/en-US/text/shared/01/ref_pdf_export_universal_accessibility.html"
"veraPDF" = "https://verapdf.org/"

[tool.hatch.build.targets.wheel]
packages = ["src/odfa11y"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/odfa11y",
  "/tests",
  "/tools",
  "/docs",
  "/.github",
  "/.editorconfig",
  "/.gitattributes",
  "/.gitignore",
  "/.python-version",
  "/tach.toml",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra -p no:tach"
strict = true
filterwarnings = ["error"]
faulthandler_timeout = 300
testpaths = ["tests"]
# Remove successful tmp_path outputs; retain pytest's three-session failed-call history.
tmp_path_retention_policy = "failed"
markers = [
  "integration: tests that invoke an external application such as LibreOffice",
]

[tool.coverage.run]
branch = true
source_pkgs = ["odfa11y"]

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true

[tool.ty.environment]
python-version = "3.15"

[tool.ty.src]
include = ["src", "tests", "tools"]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
required-version = "==0.17.3"
target-version = "py315"
preview = true
line-length = 100
respect-gitignore = false
# Check authored hidden/ignored Python; generated distribution trees exist only at the root.
exclude = [".git", ".venv", "__pycache__", ".ruff_cache", "build/**", "dist/**"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # These rules conflict with Ruff's formatter; formatting is checked separately.
  "missing-trailing-comma",
  # Use the brief's standard noqa syntax; RUF100 still rejects stale suppressions.
  "noqa-comments",
  # Cohesion is reviewed; these incidental function-size caps are not requirements.
  "too-many-arguments",
  "too-many-return-statements",
  "too-many-statements",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 10

[tool.ruff.lint.pydocstyle]
# Public APIs use NumPy-style docstrings; this resolves competing docstring conventions.
convention = "numpy"
property-decorators = ["odfa11y.serialization.JsonProperty"]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.flake8-copyright]
notice-rgx = "SPDX-License-Identifier: MPL-2\\.0"
min-file-size = 0

[tool.ruff.lint.per-file-ignores]
# Pytest assertions, descriptive test names, literal expectations and exact render comparisons.
"tests/**" = ["assert", "undocumented-public-function", "magic-value-comparison", "float-equality-comparison"]
# Test subprocesses select local tools; pypdf fixtures require its private registration API.
"tests/test_architecture.py" = ["suspicious-subprocess-import"]
"tests/test_cli_input_failures.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"tests/test_external_tools.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"tests/test_pdf_inspection.py" = ["private-member-access"]
"tests/pdf_fixtures.py" = ["private-member-access"]
